[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "prismo"
dynamic = ["version"]
description = "Differentiable PN-junction photonic phase shifter"
authors = [{ name = "Benjamin Vial" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # Host-side pipeline: talks to the two solver containers over HTTP and
    # composes their adjoints in JAX via tesseract-jax's apply_tesseract. The
    # solvers themselves live in the images.
    "tesseract-core>=1.13.0",
    "tesseract-jax>=0.4.1",
    "prismo_shared",
    "jax>=0.4.30",
    "numpy>=1.26",
    "scipy>=1.11",
    "nlopt>=2.7",
    "matplotlib>=3.8",
    "pillow>=10",
    "typer>=0.9.0",
    "gmsh>=4.15.2",
]

[project.optional-dependencies]
dev = [
    # In-process runs and the test-suite serve the components' tesseract_api
    # modules via Tesseract.from_tesseract_api, which imports
    # tesseract_core.runtime (not in the bare wheel).
    "tesseract-core[runtime]>=1.13.0",
    "pytest>=7.0",
    "tomli>=2.0; python_version < '3.11'",
    "pre-commit",
    "ruff",
]
docs = [
    # autosummary imports tesseract_core.runtime (for the pipeline's
    # docstrings), which needs the runtime extra's lz4 dependency.
    "tesseract-core[runtime]>=1.13.0",
    "sphinx",
    "shibuya",
    "sphinx-copybutton",
    "sphinx-design",
    "myst-parser",
    "sphinx-iconify",
    "sphinx-autodoc-typehints",
    "sphinx-sitemap",
    "sphinxcontrib-mermaid",
]

[tool.uv.sources]
prismo_shared = { path = "../components/shared_code", editable = true }

[project.scripts]
"prismo" = "prismo.main:entrypoint"

# Version is derived from git tags via hatch-vcs. Tag a release (e.g. `git tag
# v0.1.0`) to set the version; between tags it is inferred from the latest tag
# plus commit distance. `raw-options.root` points at the repository root one
# level up, since this package lives in the `app/` subdirectory of the monorepo.
# `fallback-version` keeps builds working when git metadata is unavailable
# (e.g. building from an sdist or outside a checkout). `tag_regex` widens the
# setuptools-scm default so a tag carrying a suffix (`v0.1.0-submission`) still
# yields a PEP 440 version instead of failing the build.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unknown"
raw-options = { root = "..", tag_regex = "^(?:[\\w-]+-)?(?P<version>[vV]?\\d+(?:\\.\\d+){0,2})(?:[-.][^+]*)?(?:\\+.*)?$" }

[tool.hatch.build.hooks.vcs]
version-file = "prismo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["prismo"]

[tool.pytest.ini_options]
markers = ["slow: takes more than a few seconds (deselect with -m 'not slow')"]
