[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "prismo"
dynamic = ["version"]
description = "Differentiable PN-junction photonic phase shifter: ChargeTransport.jl + gyptis composed as Tesseracts"
authors = [{ name = "Benjamin Vial" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # Host-side pipeline: talks to the two solver containers over HTTP and
    # composes their adjoints in JAX. The solvers themselves live in the images.
    "tesseract-core==1.11.0",
    "prismo_shared",
    "jax>=0.4.30",
    "numpy>=1.26",
    "scipy>=1.11",
    "nlopt>=2.7",
    "matplotlib>=3.8",
    "pillow>=10",
    "typer>=0.9.0",
    "gmsh>=4.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit",
    "ruff",
]
docs = [
    "sphinx",
    "shibuya",
    "sphinx-copybutton",
    "sphinx-design",
    "myst-parser",
    "sphinx-iconify",
    "sphinx-autodoc-typehints",
    "sphinx-sitemap",
    "sphinxcontrib-mermaid",
]

[tool.uv.sources]
prismo_shared = { path = "../components/shared_code", editable = true }

[project.scripts]
"prismo" = "prismo.main:entrypoint"

# Version is derived from git tags via hatch-vcs. Tag a release (e.g. `git tag
# v0.1.0`) to set the version; between tags it is inferred from the latest tag
# plus commit distance. `raw-options.root` points at the repository root one
# level up, since this package lives in the `app/` subdirectory of the monorepo.
# `fallback-version` keeps builds working when git metadata is unavailable
# (e.g. building from an sdist or outside a checkout).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unknown"
raw-options = { root = ".." }

[tool.hatch.build.hooks.vcs]
version-file = "prismo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["prismo"]

[tool.pytest.ini_options]
markers = ["slow: takes more than a few seconds (deselect with -m 'not slow')"]
