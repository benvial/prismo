# Conda environment for the Binder image (repo2docker). One environment holds
# both solvers in-process: gyptis + legacy FEniCS from conda-forge for the
# optical eigensolve, and the host app's JAX/NLopt stack. Julia and the
# ChargeTransport.jl packages come from binder/Project.toml. The app itself is
# pip-installed in binder/postBuild.
name: prismo
channels:
  - conda-forge
dependencies:
  # tesseract-jax>=0.4.1 (pinned in app/pyproject.toml) needs Python>=3.12.
  # binder/runtime.txt pins the same version: repo2docker picks
  # JuliaProjectTomlBuildPack for this repo (binder/Project.toml present),
  # which inherits its python_version detection from PythonBuildPack, not
  # CondaBuildPack -- it reads runtime.txt, not this file's python= pin.
  # Without runtime.txt it silently builds the base notebook env on Python
  # 3.10, then has to upgrade the whole pre-built Jupyter stack in place to
  # reach the version pinned here, a large enough transaction to trip a
  # libmamba package-cache bug ("Cannot find a valid extracted directory
  # cache") and fail the build.
  - python=3.12
  - gyptis
  # Unconstrained, the solver pairs fenics with a 2022 jax; the app needs >=0.4.30.
  - jax>=0.4.30
  - nlopt
  - python-gmsh
  - numpy>=1.26
  - scipy>=1.11
  - matplotlib>=3.8
  - pillow>=10
  - pip
  # Notebook helpers: render the PDF figures to PNG, encode the doping mp4.
  - poppler
  - ffmpeg
