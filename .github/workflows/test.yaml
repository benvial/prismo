name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Host-side unit tests only (they drive the pipeline through injected
    # solver doubles). The component regression tests (`make test gyptis`,
    # `make test chargetransport`) need the two solver images — a conda FEniCS
    # image and a Julia base image — which take too long to build on a hosted
    # runner; run them locally after `make build`.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries for gmsh
        # The gmsh wheel dlopens libGLU and a few X11 libraries even headless.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          make install

      - name: Run app tests
        run: make test app
