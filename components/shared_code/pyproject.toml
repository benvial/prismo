[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prismo_shared"
version = "0.1.0"
description = "Shared code for Tesseract Photonic Waveguide tesseracts"
authors = [{ name = "prismo" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["prismo_shared", "prismo_shared.*"]
