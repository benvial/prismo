[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract_photonic_waveguide_shared"
version = "0.1.0"
description = "Shared code for Tesseract Photonic Waveguide tesseracts"
authors = [{ name = "tesseract-hackathon" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tesseract_photonic_waveguide_shared", "tesseract_photonic_waveguide_shared.*"]
