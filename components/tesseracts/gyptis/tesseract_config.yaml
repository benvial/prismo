# Tesseract configuration file

name: "prismo_gyptis"
version: "0.1.0"
description: "gyptis electromagnetic eigenmode solver with Hellmann-Feynman eigen-adjoint VJP"

# Environment variables to set in the container
# env:
#   MY_VAR: "my_value"

# Arbitrary user-defined metadata
# metadata:
#   key: value

build_config:
  # Base image to use for the container, must be Ubuntu or Debian-based.
  # miniforge3 (Debian-based) provides conda for tesseract_environment.yaml.
  base_image: "condaforge/miniforge3"

  # Conda provider: dependencies come from tesseract_environment.yaml
  # (gyptis + legacy FEniCS via conda-forge; python_version set there).
  requirements:
    provider: conda

  # A uv-pip Tesseract pins its interpreter with
  # `requirements: {provider: uv-pip, python_version: "3.12"}`. That option does
  # not exist for the conda provider: the version comes from
  # tesseract_environment.yaml instead.

  # If true, create the Python virtual environment with --system-site-packages so
  # it inherits packages pre-installed in the base image. Cannot be combined with
  # python_version.
  # inherit_base_image_packages: false

  # Platform to build the container for. In general, images can only be executed
  # on the platform they were built for.
  target_platform: "native"

  package_data:
    - ["warmup.py", "/tmp/gyptis-warmup.py"]

  custom_build_steps:
    - |
      # PKG_CONFIG_PATH: the fenics-dolfin conda package ships no activate.d
      # hook, so pkg-config never sees its dolfin.pc otherwise -- `import
      # dolfin` (pulled in by gyptis) fails with "Could not find DOLFIN
      # pkg-config file". The conda provider always installs the env at
      # /python-env (see Dockerfile.base).
      ENV XDG_CACHE_HOME=/opt/gyptis-cache \
          DIJITSO_CACHE_DIR=/opt/gyptis-cache/dijitso \
          INSTANT_CACHE_DIR=/opt/gyptis-cache/instant \
          MPLCONFIGDIR=/tmp/matplotlib \
          PKG_CONFIG_PATH=/python-env/lib/pkgconfig
      RUN mkdir -p /opt/gyptis-cache/dijitso /opt/gyptis-cache/instant \
          /tmp/matplotlib && \
          python /tmp/gyptis-warmup.py && \
          chmod -R a+rwX /opt/gyptis-cache

  # Additional packages to install in the container (via apt-get)
  # extra_packages:
  #  - package_name

  # Data to copy into the container, relative to the project root
  # package_data:
  #  - [path/to/source, path/to/destination]

  # Additional Dockerfile commands to run during the build process
  # custom_build_steps:
  #  - |
  #   RUN echo "Hello, World!"
