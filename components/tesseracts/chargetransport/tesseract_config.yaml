# Tesseract configuration file
# ChargeTransport.jl semiconductor drift-diffusion solver (Julia)
# Worker pattern: Python tesseract_api.py owns one Julia worker with NPY I/O

name: "prismo_chargetransport"
version: "0.1.0"
description: "ChargeTransport.jl drift-diffusion solver with persistent-worker discrete-adjoint VJP"

build_config:
  # Python version installed via uv
  python_version: "3.12"

  # Project-built base image (see Dockerfile.julia-base in this directory):
  # Julia 1.10 LTS + all pinned packages installed and PRECOMPILED, depot at
  # /opt/julia_depot, JULIA_DEPOT_PATH / JULIA_PROJECT already set.
  #
  # Why a custom base instead of custom_build_steps: Tesseract's generated
  # Dockerfile injects custom_build_steps AFTER the code COPY layers, so any
  # edit to tesseract_api.py or scripts/ would force the ~1.6GB Julia depot
  # to be re-created. With the depot baked into this base image, a
  # `tesseract build` after a code change only re-layers the Python venv +
  # scripts — seconds instead of minutes.
  #
  # Rebuild the base ONLY when julia_env/Project.toml or Manifest.toml change:
  #   make julia-base chargetransport
  base_image: "prismo_chargetransport_julia_base:latest"

  # Platform to build the container for
  target_platform: "native"

  # No extra_packages, no custom_build_steps: everything Julia-related ships
  # in the base image. (git is only needed by Pkg at base-image build time;
  # no system BLAS/LAPACK — Julia bundles its own via LinearAlgebra stdlib.)

  # Copy Julia scripts and the pinned environment into the container.
  # JULIA_PROJECT (set by the base image) makes `julia script.jl` resolve
  # against /tesseract/julia_env, which must match the Manifest used to
  # precompile the depot in the base image.
  package_data:
    - ["scripts", "scripts"]
    - ["julia_env", "julia_env"]
